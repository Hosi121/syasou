name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check:moonbit
      - run: npm run build
      - name: Ensure generation leaves tracked sources unchanged
        run: git diff --exit-code
      - run: npm run test:moonbit
      - run: npm run moon -- test moonbit/interop --target wasm-gc
      - run: npm run moon -- test moonbit/domain --target native
      - run: npm run test:wasm
